<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="체크인">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131216" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>체크인</title>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1d1b20;--muted:#6b6770;--line:#e6e2da;--chip:#f0ede7;
  --smoke:#b85e17;--drink:#8a3fa0;--ok:#2f7d5b;--warn:#b3412e;--on-accent:#ffffff;
  --accent:var(--smoke);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131216;--card:#1d1b21;--ink:#f2eff5;--muted:#a39ea9;--line:#2d2a32;--chip:#27242c;
    --smoke:#f0a35c;--drink:#c995dc;--ok:#6cc79c;--warn:#ef8a78;--on-accent:#1a1418;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131216;--card:#1d1b21;--ink:#f2eff5;--muted:#a39ea9;--line:#2d2a32;--chip:#27242c;
  --smoke:#f0a35c;--drink:#c995dc;--ok:#6cc79c;--warn:#ef8a78;--on-accent:#1a1418;color-scheme:dark;
}
body[data-type="drink"]{--accent:var(--drink)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;min-height:100vh;word-break:keep-all;overflow-wrap:anywhere;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));
}
main{max-width:560px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:26px;margin:8px 0 12px;letter-spacing:-.02em}
h3.day{font-size:14px;color:var(--muted);font-weight:600;margin:20px 4px 8px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.q{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;font-weight:600}
.q small{font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:8px 13px;font-size:15px;line-height:1.2;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:10px;height:42px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg .seg-smoke[aria-pressed="true"]{color:var(--smoke)}
.seg .seg-drink[aria-pressed="true"]{color:var(--drink)}
.crave-val{font-size:28px;line-height:1;color:var(--accent);display:flex;align-items:baseline;gap:6px}
.crave-val small{font-size:13px;color:var(--muted);font-weight:500}
.crave{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.crave button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-weight:600;font-variant-numeric:tabular-nums}
.crave button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}
textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;resize:vertical;min-height:72px}
input[type="datetime-local"],input[type="time"]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:42px}
input[type="datetime-local"]{width:100%}
.primary,.secondary,.danger{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;margin-top:8px;position:relative}
.primary{border:0;background:var(--accent);color:var(--on-accent)}
.secondary{border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px}
.danger{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:transparent;color:var(--warn);font-weight:600;font-size:16px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.editbar{display:flex;justify-content:space-between;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px;font-size:14px}
.today .slotrow{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:14px}
.today .slotrow>span:first-child{font-weight:700;min-width:30px;padding-top:3px}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{font-size:13px;border-radius:8px;padding:3px 8px;background:var(--chip);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.slot.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.slot.missed{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,var(--line))}
.streaks{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted)}
.streaks b{color:var(--ink)}
.t-smoke{color:var(--smoke)} .t-drink{color:var(--drink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.stats div{background:var(--chip);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;margin-top:6px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px}
.bar-smoke,.dot-smoke{fill:var(--smoke)} .bar-drink,.dot-drink{fill:var(--drink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.list{padding:0;overflow:hidden}
.entry{display:grid;grid-template-columns:46px 34px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px}
.entry:last-child{border-bottom:0}
.e-time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;padding-top:5px}
.e-crave{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--chip)}
.e-crave.e-smoke{color:var(--smoke)} .e-crave.e-drink{color:var(--drink)}
.entry.used .e-crave{background:var(--warn);color:#fff}
.e-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.e-tags{font-size:14px;line-height:1.4}
.e-tags b{margin-right:4px}
.e-memo{font-size:14px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days .chip{padding:8px 0;text-align:center}
.sub{font-size:13px;color:var(--muted);margin:14px 0 8px}
.time{display:inline-flex;align-items:center;gap:4px;padding-right:4px;font-variant-numeric:tabular-nums}
.time button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.addtime{display:flex;gap:8px;margin-top:10px}
.addtime button{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:0 14px;font-weight:600;min-height:42px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(20px)}
.sch-smoke .chip[aria-pressed="true"]{background:var(--smoke)}
.sch-drink .chip[aria-pressed="true"]{background:var(--drink)}
.empty{text-align:center;padding:32px 16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:transparent;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-type="smoke">
<main>
  <section id="view-check">
    <div id="today"></div>
    <div id="form"></div>
  </section>
  <section id="view-log" hidden></section>
  <section id="view-alarm" hidden></section>
  <section id="view-more" hidden></section>
</main>
<nav class="tabs" aria-label="메뉴"><div>
  <button data-act="tab" data-v="check" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.7"/></svg>체크</button>
  <button data-act="tab" data-v="log"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>기록</button>
  <button data-act="tab" data-v="alarm"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 004 0"/></svg>알림</button>
  <button data-act="tab" data-v="more"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 10.5L12 15l4.5-4.5"/><path d="M4 17v2.5h16V17"/></svg>백업</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
